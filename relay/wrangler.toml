name = "chalisa-relay"
main = "src/index.ts"
compatibility_date = "2025-01-01"

[triggers]
crons = ["* * * * *"]

[[kv_namespaces]]
binding = "TOKENS"
id = "REPLACE_WITH_KV_ID"

[[d1_databases]]
binding = "DB"
database_name = "chalisa"
database_id = "REPLACE_WITH_D1_ID"

[assets]
directory = "./public"
binding = "ASSETS"